[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wattplan"
version = "0.6.4-alpha"
requires-python = ">=3.14"
dependencies = [
  "numpy>=2,<3",
  "pydantic>=2",
  "highspy>=1.15,<2",
  "fluent.runtime==0.4.0",
]

[project.optional-dependencies]
test = [
  "pytest-homeassistant-custom-component==0.13.317",
  "pytest-cov",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = [
  "tests",
]
asyncio_mode = "auto"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["custom_components*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.wattplan" = ["*.json", "*.yaml", "*.png", "translations/*.json", "locales/**/*.ftl"]

# Coverage is opt-in: run `pytest --cov` (CI does). The default pytest
# invocation does not require pytest-cov.
[tool.coverage.run]
source = ["custom_components.wattplan"]

[tool.coverage.report]
# Measured 86% when this floor was set; keep it a few points below.
fail_under = 83
skip_empty = true
